[workspace]

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
allow_attributes_without_reason = "deny"

[package]
name = "actool"
version = "2.2.4"
edition = "2024"
description = "Open reimplementation of Apple's actool for compiling xcassets and icons"
license = "MIT"

[[bin]]
name = "actool"
path = "src/main.rs"

[lib]
name = "actool"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dunce = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
lzfse = "0.2"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
anyhow = "1"
regex = "1"
crc32fast = "1"

# Pure-Rust stand-ins for CoreSVG and CoreGraphics, which only macOS has. No font discovery:
# a build machine's installed fonts must not change what an icon compiles to.
[target.'cfg(not(target_os = "macos"))'.dependencies]
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
hayro = "0.9"

[dev-dependencies]
tempfile = "3"
plist = "1"

[lints]
workspace = true
